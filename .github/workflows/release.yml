name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }} — Public Beta

            LokiASAM is a desktop manager for Ark Survival Ascended dedicated servers, built for Linux and Windows. This is the first public beta release.

            ### What's included

            **Server management**
            - Create, start, stop, restart, clone, and delete dedicated ASA servers
            - Import existing server installations
            - Live status monitoring with CPU/RAM and player counts via Source Query

            **Configuration**
            - Structured INI editor for `GameUserSettings.ini` and `Game.ini`
            - Raw textarea toggle for direct editing
            - Import config files from an existing server

            **RCON**
            - Live terminal console with command history and presets
            - Broadcast to all players with one click

            **Mods**
            - Install mods by ID, reorder, toggle, and remove
            - Built-in CurseForge mod browser with one-click add

            **Backups & Automation**
            - Manual and scheduled ZIP backups with retention settings
            - Cron-based schedules for backups, updates, restarts, and RCON broadcasts
            - Scheduler runs in Rust — continues firing while the app is minimized to tray

            **Clusters**
            - Group servers into clusters with a shared directory

            **Notifications**
            - Discord webhooks, email (SMTP), and desktop notifications per server event

            **Linux support**
            - Proton-GE integration for running the Windows ASA server binary
            - Auto-detection and download of Proton-GE

            **App updates**
            - Automatic update checks on startup (configurable in Settings)

            ### Installation

            **Linux:** Download `LokiASAM_0.9.0_amd64.AppImage`, make it executable, and run it.
            ```bash
            chmod +x LokiASAM_0.9.0_amd64.AppImage
            ./LokiASAM_0.9.0_amd64.AppImage
            ```
            > The AppImage version receives automatic update notifications. The `.deb` does not.

            **Windows:** Run `LokiASAM_0.9.0_x64-setup.exe`.

            ### Known limitations
            - This is a beta release — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true
