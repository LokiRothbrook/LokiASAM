name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }}

            ### Bug fixes

            **AppImage: server start now works**
            The AppImage version failed to start servers immediately after clicking Start. The AppImage runtime injects its own bundled libraries and Python environment into child processes (`LD_LIBRARY_PATH`, `PYTHONHOME`). Proton — a Python script — inherited `PYTHONHOME` pointing into the AppImage squashfs mount, causing Python to crash instantly with `No module named 'encodings'` before Wine ever ran. The app now restores the pre-AppImage environment before spawning the server process. The standalone binary and `.deb` package were not affected.

            **Server stuck in "Starting" after app restart**
            If the app was closed while a server was in the middle of starting, the server could get stuck in "Starting" permanently on the next launch with no error shown. Two causes were fixed: (1) the Tauri event listener was registered after a dynamic module import, creating a brief window where status-change events could be missed — the module is now pre-loaded so the listener is ready immediately; (2) startup reconciliation now checks servers left in "Starting" state and resets them to "Stopped" if their process is no longer alive.

            **Start failure notifications now include error details**
            When a server process exits immediately after launch, the notification now includes the last output from the process — making it clear why it failed rather than showing a generic crash message. "Server failed to start" is now a distinct notification event from "Server crashed while running", configurable separately in the Automation tab.

            ### Installation

            **Linux:** Download the `.AppImage`, make it executable, and run it.
            ```bash
            chmod +x LokiASAM_0.9.1_amd64.AppImage
            ./LokiASAM_0.9.1_amd64.AppImage
            ```
            > The AppImage version receives automatic update notifications. The `.deb` does not.

            **Windows:** Run `LokiASAM_0.9.1_x64-setup.exe`.

            ### Notes
            - This is a beta release — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true
