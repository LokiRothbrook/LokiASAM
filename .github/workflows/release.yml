name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }} — Public Beta

            LokiASAM is a desktop application for managing ARK: Survival Ascended dedicated servers on Linux and Windows.

            ### What's new in ${{ github.ref_name }}

            This is a bug-fix release focused on custom/mod map handling and a couple of server-lifecycle edge cases.

            **Fix: Custom mod maps not working**
            A server created (or switched) to a custom mod map now actually launches on that map. Previously the launch arguments silently fell back to The Island, the server details page showed a garbled internal ID instead of the map's name, and custom maps didn't appear in the Settings map dropdown at all — all four were symptoms of the same missing wiring between the custom maps table and the rest of the app, which is now fixed everywhere it was needed (launch args, backups, the scheduler, display labels, and the dropdown).

            **Fix: Map's required mod not enforced on an existing server**
            Changing a server's map in Settings now properly adds and locks the new map's required mod (so it can't be disabled or removed while that map is selected) and removes the previous map's mod — matching what already happened correctly during server creation.

            **Fix: Copying mods from another server could drop the current map's required mod**
            The server creation wizard's "copy from server" step now merges the copied mod list instead of replacing it outright, so a mod map's required mod picked earlier in the wizard survives the copy.

            **Fix: Map mod display name and ordering**
            A map's required mod now shows the map's own name in the Mods tab instead of "Unknown Mod", and always sorts to the top of the installed mods list.

            **Fix: Servers stuck on "Updating…" after a stopped server's auto-update**
            A scheduled or startup-triggered auto-update on a stopped server would apply successfully but leave the server's status stuck showing the update-in-progress spinner, requiring a manual Cancel + Reinstall to clear. The status now correctly resets once the update finishes.

            ### Installation

            **Linux:** Download your preferred package from the assets below.

            | Format | Auto-updates | Notes |
            |--------|-------------|-------|
            | `.AppImage` | Yes | Updates in-place, no admin rights needed |
            | `.deb` | Yes | Installs via `dpkg`, prompts for your password |
            | `.rpm` | Yes | Installs via `rpm`, prompts for your password |

            > **Arch / CachyOS / Manjaro:** AppImage does not work reliably on rolling-release distros. Build from source using `./install.sh` instead — see the [README](https://github.com/LokiRothbrook/LokiASAM#arch-linux--cachyos--manjaro) for instructions.

            **Windows:** Download and run the `_x64-setup.exe` installer from the assets below.

            ### Notes
            - This is a public beta — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
            - Linux requires a working Proton-GE installation. The setup wizard will guide you through this.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true
