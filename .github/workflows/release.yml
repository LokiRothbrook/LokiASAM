name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }} — Public Beta

            LokiASAM is a desktop application for managing ARK: Survival Ascended dedicated servers on Linux and Windows.

            ### What's new in ${{ github.ref_name }}

            A big polish release: new server-management features, a guided tour, and a long list of fixes from a full review of the app.

            > **First launch after updating:** existing server configs are migrated automatically — settings that older versions wrote to the wrong place (join password, PvE mode, Game.ini-only settings, crossplay) are moved to where the game actually reads them. Your INI files are patched key by key; nothing else in them changes.

            **New: Hide Server Window**
            Run servers with no console window. On Windows this uses the native no-console flag. On Linux servers run on an invisible display using Xvfb (recommended) or gamescope's headless mode — the app detects what's installed, prefers Xvfb, and can install it for you (Config → Advanced, the creation wizard, or the first-time setup). If a hidden server hits a startup error such as a failed mod download, it's closed automatically so the normal retry runs.

            **New: Guided tour**
            An interactive tour of the app (offered at the end of setup, or from the **?** in the sidebar), plus a short tour for each server tab the first time you open it. Restart them any time from Settings.

            **New: Server Identity card** (Config tab)
            Edit a server's name, join/admin passwords, ports and max players after creation. Changes go to both the app and the game's INI files together, with port-conflict checks and an offer to open new ports in the firewall.

            **New: Clone Server, rebuilt**
            Cloning now runs through the creation wizard: new name and ports suggested, fresh INI files with the clone's own identity, and optional copying of schedules, warning settings, auto-start, hidden window and save data.

            **New: Config History**
            A snapshot is taken before every config save. Browse snapshots, see exactly which settings each would change, and restore one (the current config is snapshotted first, so a restore can be undone).

            **New: Admins & Whitelist editor** (Config → Advanced)
            Edit the admin list, exclusive-join whitelist and join-bypass list from the app, with the `-exclusivejoin` switch alongside.

            **New: Save checks**
            Before saving config you're warned about anything that would break the server or the app: RCON disabled, a blank admin password, a clashing RCON port, a setting missing its required launch flag, or exclusive join with an empty whitelist.

            **New: Auto-Start in the Automation tab and wizard**, **Server Platform selector** (`-ServerPlatform=`, replacing the old non-working crossplay toggles), **Message of the Day editor**, **Memory-Limit Restart** now warns players first, and **Scheduled Restart / Memory-Limit Restart notifications**.

            **Fixes**
            - Quick Setup, INI import and paste no longer wipe `[ServerSettings]` (admin password, RCON settings) — settings are merged key by key and server identity is never overwritten. Quick Setup now applies the same presets as the creation wizard.
            - Imported servers no longer open a blank Config tab, and saving can no longer replace their real INI files.
            - Breeding, spoiling, decomposition and other Game.ini-only sliders now actually take effect (they were written to GameUserSettings.ini). The PvE toggle now sets `ServerPVE`, and the join password is written to `[ServerSettings]`.
            - Restart warnings chosen in the creation wizard now apply (they were silently ignored); `{time}` is the placeholder.
            - Clusters: data no longer nests an extra `clusters/<id>` folder deep, and `-NoTransferFromFiltering` is applied automatically to every cluster member.
            - Copying mods (wizard, clone, Mods tab) no longer brings another map's mod along — previously it could even be locked on the target.
            - Mod reorder arrows now work, and reordering keeps your scroll position.
            - Notifications: every toggle in Settings now works (backend events like "server online" ignored them), switching a column off no longer turns everything on, email now works for all events, and the bell shows the exact unread count.
            - Force Stop / Force Stop All / Restart All Now are clickable immediately instead of only after navigating away.
            - Proton-GE installs with the new `-x86_64` folder naming now complete, and update checks recognize them.
            - Active events now load via their mod only (the obsolete `-ActiveEvent` flag is no longer passed).
            - Server operations (backups, updates, restarts) queue behind each other instead of failing when one is already running.
            - Theme: accent colors and theme presets now apply everywhere, and dropdowns use the app's styled menus instead of the system's.

            ### Installation

            **Linux:** Download your preferred package from the assets below.

            | Format | Auto-updates | Notes |
            |--------|-------------|-------|
            | `.AppImage` | Yes | Updates in-place, no admin rights needed |
            | `.deb` | Yes | Installs via `dpkg`, prompts for your password |
            | `.rpm` | Yes | Installs via `rpm`, prompts for your password |

            > **Arch / CachyOS / Manjaro:** AppImage does not work reliably on rolling-release distros. Build from source using `./install.sh` instead — see the [README](https://github.com/LokiRothbrook/LokiASAM#arch-linux--cachyos--manjaro) for instructions.

            **Windows:** Download and run the `_x64-setup.exe` installer from the assets below.

            ### Notes
            - This is a public beta — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
            - Linux requires a working Proton-GE installation. The setup wizard will guide you through this.
          # Built as a draft and published by the `publish` job below once every
          # platform has uploaded. A published release becomes "latest" right
          # away, and until latest.json was uploaded the in-app updater's
          # releases/latest/download/latest.json link 404'd for every user.
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true

  publish:
    # Runs only if every platform build succeeded — a failed build leaves the
    # draft unpublished, so a half-uploaded release never becomes "latest".
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
