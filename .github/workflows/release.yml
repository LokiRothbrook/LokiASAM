name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }} — Public Beta

            LokiASAM is a desktop application for managing Ark Survival Ascended dedicated servers on Linux and Windows.

            ### What's new in v0.11.0

            **Server stats history**
            CPU and RAM usage are now recorded to a local database in the background. The Overview tab shows live charts of resource usage over time so you can see how your server behaves across a session, not just at a single moment.

            **Server status on startup**
            The app now scans running OS processes on launch to determine which servers are actually running, rather than relying on stored state. If a server crashed or was stopped while the app was closed, the status will be correct immediately on next open.

            **Launch parameters**
            You can now configure per-server launch arguments through the UI — both in the setup wizard and the server config tab — without editing config files manually.

            **Graceful shutdown settings**
            Servers now have configurable graceful shutdown behaviour, letting you control how the shutdown sequence is handled per server.

            **Per-server update automation**
            Update automation is now configured per server rather than globally, with in-app notifications when updates are available for the server's installed version.

            **New game settings**
            - PvP friendly fire toggle added
            - Cryo sickness handling option added

            ### Improvements

            - **RCON** — improved tab layout, scrolling behaviour, and reliability. IO errors and timeouts are now distinguished and reported separately. Player list updates are handled via events.
            - **Log handling** — ShooterGame.log is now rotated on server startup so the log viewer always starts from a clean slate for that session.
            - **UI controls** — toggle switches replaced with icon buttons for better clarity. Numeric settings now use a combined number field and slider control.
            - **Setup wizard** — improved visual effects and theme handling.

            ### Bug fixes

            - **Linux/Arch/CachyOS: blank screen on launch** — modern distros with newer GPU drivers could get a blank white window due to a WebKit DMA-BUF renderer incompatibility. Fixed.
            - **Linux/KDE: title bar buttons stop working** — minimising and restoring the window on KDE could leave the decoration buttons unresponsive. Fixed.
            - **Startup: Steam error output** — noisy Steam deprecation warnings are no longer surfaced as server errors in the log.
            - **Startup: missing executable** — clearer error notification when the server binary can't be found at launch.

            ### Installation

            **Linux:** Download your preferred package from the assets below.

            | Format | Auto-updates | Notes |
            |--------|-------------|-------|
            | `.AppImage` | Yes | Updates in-place, no admin rights needed |
            | `.deb` | Yes | Installs via `dpkg`, prompts for your password |
            | `.rpm` | Yes | Installs via `rpm`, prompts for your password |

            ```bash
            chmod +x LokiASAM_0.11.0_amd64.AppImage
            ./LokiASAM_0.11.0_amd64.AppImage
            ```

            **Windows:** Download and run `LokiASAM_0.11.0_x64-setup.exe` from the assets below.

            ### Notes
            - This is a public beta — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
            - Linux requires a working Proton-GE installation. The setup wizard will guide you through this.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true
