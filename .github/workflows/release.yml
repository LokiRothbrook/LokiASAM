name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }} — Public Beta

            LokiASAM is a desktop application for managing Ark Survival Ascended dedicated servers on Linux and Windows.

            ### What's new in v0.12.0

            **Firewall management**
            LokiASAM can now detect your system firewall (UFW, firewalld, iptables on Linux; Windows Defender Firewall on Windows) and open the required ports for each server with a single elevation prompt. A dedicated Firewall step in the server creation wizard checks port status and offers to fix missing rules before you ever try to start. A non-blocking warning notification is shown at startup if a rule is missing. You can also check and repair rules for all servers at any time from Settings → Tools → Firewall Rules. When deleting a server, you're offered the option to clean up firewall rules for ports that no longer have any server behind them.

            **Amazon Root CA certificate install**
            Servers with mods can fail to start with a CurseForge API TLS error when the Amazon Root CA 1 certificate is missing from the Wine/Windows cert store. The setup wizard now includes a certificate install step that fixes this automatically. The same action is available under Settings → Tools → Amazon Root CA for reinstallation at any time.

            **CurseForge API auto-retry**
            When a server exits immediately after logging the CurseForge "serverUnreachable" error, LokiASAM now automatically retries the launch up to three times before declaring start-failed. This handles the common case where the CurseForge API is briefly rate-limiting or slow at startup. If all three attempts fail, a detailed notification explains the cause and suggests next steps.

            **Expanded backup system**
            Backups now support three types: full server backups, player save backups (per player EOS ID), and INI config backups. Player backups can be restored individually. The backup tab and scheduler have been updated to reflect the new options.

            **Logs page**
            A dedicated Logs page is now accessible from the sidebar. It provides four views: Live (tail of the current ShooterGame.log), Archive (past session logs), Crashes (crash dump files), and Chat (chat log history). Logs are automatically archived when a server stops or crashes so previous sessions are always accessible. Old logs are cleaned up automatically based on retention settings.

            **Auto-start on launch**
            Each server now has an auto-start toggle. Servers marked for auto-start will be queued and started sequentially when the app launches, one at a time to avoid overloading the host.

            **Quick Start Guide**
            A `?` button in the sidebar opens the Quick Start Guide from anywhere in the app. The guide now includes a slide covering port forwarding and VPN services for players connecting from outside your home network. Clicking "Quick Start Guide" on the setup wizard completion screen takes you directly to the dashboard with the guide already open.

            **Updated application icons**
            New icon set with improved clarity at all sizes. Linux builds include adaptive launcher icons.

            ### Improvements

            - **Setup wizard** — auto-update settings are now configured during first-time setup. The wizard completion screen includes a Quick Start Guide button that opens the tour on the dashboard.
            - **Server creation wizard** — added a Firewall step and a port forwarding info card in the Network step.
            - **Logs tab** — the per-server Logs tab now loads the last session's log on open, even when the server is stopped. Logs are archived automatically on server state changes.
            - **Mods tab** — added a note reminding users that a server restart is required for mod changes to take effect.
            - **Sidebar** — Logs and Backups are now top-level navigation items. Tooltip backgrounds and contrast improved across all nav items.
            - **Theme** — updated built-in theme presets and accent colours for improved consistency.
            - **Settings** — Tools section now includes rows for certificate install/reinstall and firewall rule check/repair.

            ### Installation

            **Linux:** Download your preferred package from the assets below.

            | Format | Auto-updates | Notes |
            |--------|-------------|-------|
            | `.AppImage` | Yes | Updates in-place, no admin rights needed |
            | `.deb` | Yes | Installs via `dpkg`, prompts for your password |
            | `.rpm` | Yes | Installs via `rpm`, prompts for your password |

            ```bash
            chmod +x LokiASAM_0.12.0_amd64.AppImage
            ./LokiASAM_0.12.0_amd64.AppImage
            ```

            **Windows:** Download and run `LokiASAM_0.12.0_x64-setup.exe` from the assets below.

            ### Notes
            - This is a public beta — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
            - Linux requires a working Proton-GE installation. The setup wizard will guide you through this.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true
