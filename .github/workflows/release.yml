name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }} — Public Beta

            LokiASAM is a desktop application for managing ARK: Survival Ascended dedicated servers on Linux and Windows.

            ### What's new in ${{ github.ref_name }}

            **Server Creation Wizard — major overhaul**
            The Guided Custom section has been reworked from a single slider page into four dedicated steps: **Core Rates**, **Breeding**, **Combat**, and **Server QoL**. Each step covers the relevant settings with sliders, toggles, and contextual help. The Breeding page includes a live warning when food consumption is set higher than mature speed — a common misconfiguration that causes baby dinos to starve before they fully mature.

            **Preset config fixes**
            The Official, Casual, and Boosted presets now correctly apply all `GameUserSettings.ini` and `Game.ini` values per game mode, matching the documented target settings for each style.

            **Full Customize INI — tooltip descriptions**
            Every field in the Full Customize INI section now has a `?` icon that shows a description tooltip on hover, making it easier to understand what each setting does without leaving the wizard.

            **INI field defaults**
            Fields that are not explicitly set by the selected preset now show their documented game default value instead of `0`.

            **Map list correction**
            Genesis Part 1 has been removed from the available map list — it is not yet released for ARK: Survival Ascended.

            **Slider improvements**
            The default value marker on all sliders has been relabelled from `def` to `default` and its alignment has been corrected to match the actual thumb position at all values.

            **Password visibility toggles**
            All password inputs now have an eye icon to reveal or hide the entered text — admin password, server password, their confirm fields, and the SMTP password in the setup wizard.

            **Live chat log**
            The chat panel now updates in real time via Tauri events. No manual refresh is needed.

            **Cleaner server restart**
            Server restarts now use RCON `saveworld` followed by `doexit` for a clean, save-first shutdown instead of a raw process signal.

            **Notification system improvements**
            Notification matrix state management has been reworked and event wiring fixed. Auto-update notification options have been reworked.

            **Setup wizard additions**
            Directory wipe functionality added. Build version is now tracked and displayed in the wizard footer.

            **Backup & scheduling fixes**
            Backup scheduling accuracy improved. Schedule filtering logic corrected.

            ### Installation

            **Linux:** Download your preferred package from the assets below.

            | Format | Auto-updates | Notes |
            |--------|-------------|-------|
            | `.AppImage` | Yes | Updates in-place, no admin rights needed |
            | `.deb` | Yes | Installs via `dpkg`, prompts for your password |
            | `.rpm` | Yes | Installs via `rpm`, prompts for your password |

            > **Arch / CachyOS / Manjaro:** AppImage does not work reliably on rolling-release distros. Build from source using `./install.sh` instead — see the [README](https://github.com/LokiRothbrook/LokiASAM#arch-linux--cachyos--manjaro) for instructions.

            **Windows:** Download and run the `_x64-setup.exe` installer from the assets below.

            ### Notes
            - This is a public beta — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
            - Linux requires a working Proton-GE installation. The setup wizard will guide you through this.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true
