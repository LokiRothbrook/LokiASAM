name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LokiASAM ${{ github.ref_name }}'
          releaseBody: |
            ## LokiASAM ${{ github.ref_name }} — Public Beta

            LokiASAM is a desktop application for managing ARK: Survival Ascended dedicated servers on Linux and Windows.

            ### What's new in ${{ github.ref_name }}

            **Wild dino wipe scheduling**
            A new `wipe_dinos` schedule type fires `destroywilddinos` via RCON at a configured interval. A pre-wipe chat warning is automatically sent to players before the wipe executes.

            **Pre-backup RCON broadcast**
            A configurable message can be sent to players in-game before any scheduled backup runs, so they know a backup (and brief lag spike) is coming.

            **Memory limit restart**
            Each server can be given a RAM ceiling (in GB). When the stats poller detects the process exceeding that limit, LokiASAM performs a graceful restart — `saveworld`, `doexit`, then relaunch — with a cooldown to prevent restart loops.

            **Start All / Stop All / Restart All**
            Global action buttons in the server list header let you start every stopped server, stop every running server, or restart all running servers with a single click.

            **Backup path reconciliation**
            Scheduled and manual backups now use the server's `save_folder_name` as the effective save directory when configured, falling back to the map default. Fixes cases where saves were backed up from the wrong path.

            **Setup wizard — automation step rewrite**
            The automation step now matches the full TimeShift tier system from the server overview: hourly / daily / weekly / monthly tiers for server saves, player data, full backups, and login backups — instead of the old single cron picker.

            **Crossplay toggle fix**
            The Network step in the setup wizard was writing the old `AllPlatforms` flag (ASE). It now correctly writes the `crossplay` flag to stay in sync with the CLI args step.

            **Launch at login**
            A new OS-level autostart option (via `tauri-plugin-autostart`) lets LokiASAM start with your system. The toggle is available in the setup wizard tray step and in Settings → System Tray. Pairs well with the existing minimize-to-tray option.

            **Additional launch parameters**
            New performance tuning, anti-cheat, and gameplay flags added. Save folder override (`-SaveDirectoryOverride`) and active in-game event flags are now applied when starting servers.

            **Fix: Club ARK map path**
            Corrected the save path for Club ARK (`BobsMissions`) in both the backup manager and game data definitions.

            ### Installation

            **Linux:** Download your preferred package from the assets below.

            | Format | Auto-updates | Notes |
            |--------|-------------|-------|
            | `.AppImage` | Yes | Updates in-place, no admin rights needed |
            | `.deb` | Yes | Installs via `dpkg`, prompts for your password |
            | `.rpm` | Yes | Installs via `rpm`, prompts for your password |

            > **Arch / CachyOS / Manjaro:** AppImage does not work reliably on rolling-release distros. Build from source using `./install.sh` instead — see the [README](https://github.com/LokiRothbrook/LokiASAM#arch-linux--cachyos--manjaro) for instructions.

            **Windows:** Download and run the `_x64-setup.exe` installer from the assets below.

            ### Notes
            - This is a public beta — bugs are expected. Please report them on the [Issues](https://github.com/LokiRothbrook/LokiASAM/issues) page.
            - Linux requires a working Proton-GE installation. The setup wizard will guide you through this.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: false
          updaterJsonPreferNsis: true
