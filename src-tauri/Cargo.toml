[package]
name = "lokiasam"
version = "0.10.0"
description = "Loki Ark Survival Ascended Server Manager"
authors = ["Loki"]
license = "GPL-3.0-or-later"
repository = "https://github.com/LokiRothbrook/LokiASAM"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lokiasam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-log = { version = "2" }

# Tauri official plugins
tauri-plugin-sql               = { version = "2", features = ["sqlite"] }
tauri-plugin-fs                = { version = "2" }
tauri-plugin-dialog            = { version = "2" }
tauri-plugin-shell             = { version = "2" }
tauri-plugin-notification      = { version = "2" }
tauri-plugin-single-instance   = { version = "2" }
tauri-plugin-clipboard-manager = { version = "2" }
tauri-plugin-updater           = { version = "2" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (Discord webhooks, update checks)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ZIP compression for backups
zip = { version = "2" }

# Email / SMTP notifications
lettre = { version = "0.11", features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }

# System process stats (CPU / RAM per PID, cross-platform)
sysinfo = { version = "0.32" }

# INI file parsing
configparser = { version = "3" }

# Linux .tar.gz extraction for SteamCMD download
flate2 = { version = "1" }
tar   = { version = "0.4" }

# URL parsing (used by open_mod_browser; re-exported by Tauri but needed explicitly)
url = { version = "2" }

# Logging
log = "0.4"

# Direct SQLite access for the background stats recorder (separate from tauri-plugin-sql).
# "bundled" links SQLite statically so no system library is required.
rusqlite = { version = "0.32", features = ["bundled"] }

# Linux /proc reader — process discovery, PSS memory, thread detection
# Replaces hand-rolled /proc string parsing with a tested, maintained library.
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.17", default-features = false }
