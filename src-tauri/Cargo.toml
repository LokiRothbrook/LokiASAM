[package]
name = "lokiasam"
version = "0.1.0"
description = "Loki Ark Survival Ascended Server Manager"
authors = ["Loki"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lokiasam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = { version = "2" }

# Tauri official plugins
tauri-plugin-sql               = { version = "2", features = ["sqlite"] }
tauri-plugin-fs                = { version = "2" }
tauri-plugin-dialog            = { version = "2" }
tauri-plugin-shell             = { version = "2" }
tauri-plugin-notification      = { version = "2" }
tauri-plugin-single-instance   = { version = "2" }
tauri-plugin-clipboard-manager = { version = "2" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (Discord webhooks, update checks)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ZIP compression for backups
zip = { version = "2" }

# Email / SMTP notifications
lettre = { version = "0.11", features = ["tokio1", "tokio1-rustls-tls"], default-features = false }

# System process stats (CPU / RAM per PID)
sysinfo = { version = "0.32" }

# Cron scheduling
tokio-cron-scheduler = { version = "0.13", features = ["signal"] }

# INI file parsing
configparser = { version = "3" }

# Linux .tar.gz extraction for SteamCMD download
flate2 = { version = "1" }
tar   = { version = "0.4" }

# Logging
log = "0.4"
