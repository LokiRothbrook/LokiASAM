<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Glow filters -->
    <filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-led" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120a22"/>
      <stop offset="100%" stop-color="#060410"/>
    </linearGradient>

    <!-- Rack unit gradient -->
    <linearGradient id="unitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0c34"/>
      <stop offset="100%" stop-color="#0e061e"/>
    </linearGradient>

    <!-- Active unit gradient -->
    <linearGradient id="unitActiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#250e40"/>
      <stop offset="100%" stop-color="#120828"/>
    </linearGradient>

    <!-- Clip to rounded rect so nothing bleeds outside -->
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="84"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="84" fill="url(#bg)"/>

  <!-- Subtle border glow -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="83" fill="none"
        stroke="#bf00ff" stroke-width="3" stroke-opacity="0.25"/>

  <g clip-path="url(#iconClip)">

    <!-- ═══════════════════════════════════════════
         SERVER RACK CHASSIS
    ═══════════════════════════════════════════ -->
    <!-- Outer chassis body -->
    <rect x="72" y="56" width="368" height="400" rx="20" fill="#0d061c"
          stroke="#bf00ff" stroke-width="2.5" stroke-opacity="0.55"/>

    <!-- Chassis inner face (slight inset) -->
    <rect x="88" y="72" width="336" height="368" rx="12" fill="#080414"/>

    <!-- ── Rack Unit 1 ── -->
    <rect x="100" y="84"  width="312" height="62" rx="7" fill="url(#unitGrad)"
          stroke="#bf00ff" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Progress bar lines -->
    <rect x="114" y="97"  width="192" height="5" rx="2.5" fill="#bf00ff" opacity="0.50"/>
    <rect x="114" y="108" width="152" height="4" rx="2"   fill="#bf00ff" opacity="0.30"/>
    <rect x="114" y="118" width="168" height="3" rx="1.5" fill="#bf00ff" opacity="0.20"/>
    <!-- LEDs -->
    <circle cx="382" cy="104" r="7" fill="#00ff88" filter="url(#glow-led)"/>
    <circle cx="366" cy="104" r="5" fill="#00ff88" opacity="0.45"/>

    <!-- ── Rack Unit 2 (active — brightest) ── -->
    <rect x="100" y="154" width="312" height="62" rx="7" fill="url(#unitActiveGrad)"
          stroke="#bf00ff" stroke-width="2" stroke-opacity="0.75"/>
    <rect x="114" y="167" width="210" height="5" rx="2.5" fill="#bf00ff" opacity="0.80"/>
    <rect x="114" y="178" width="165" height="4" rx="2"   fill="#bf00ff" opacity="0.55"/>
    <rect x="114" y="188" width="182" height="3" rx="1.5" fill="#bf00ff" opacity="0.38"/>
    <circle cx="382" cy="174" r="7" fill="#00ff88" filter="url(#glow-led)"/>
    <circle cx="366" cy="174" r="5" fill="#00ff88" opacity="0.65"/>

    <!-- ── Rack Unit 3 ── -->
    <rect x="100" y="224" width="312" height="62" rx="7" fill="url(#unitGrad)"
          stroke="#bf00ff" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="114" y="237" width="172" height="5" rx="2.5" fill="#bf00ff" opacity="0.45"/>
    <rect x="114" y="248" width="134" height="4" rx="2"   fill="#bf00ff" opacity="0.28"/>
    <rect x="114" y="258" width="148" height="3" rx="1.5" fill="#bf00ff" opacity="0.18"/>
    <circle cx="382" cy="244" r="7" fill="#ff3355" opacity="0.85"/>
    <circle cx="366" cy="244" r="5" fill="#ff3355" opacity="0.45"/>

    <!-- ── Rack Unit 4 ── -->
    <rect x="100" y="294" width="312" height="62" rx="7" fill="url(#unitGrad)"
          stroke="#bf00ff" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="114" y="307" width="180" height="5" rx="2.5" fill="#bf00ff" opacity="0.50"/>
    <rect x="114" y="318" width="140" height="4" rx="2"   fill="#bf00ff" opacity="0.30"/>
    <rect x="114" y="328" width="158" height="3" rx="1.5" fill="#bf00ff" opacity="0.20"/>
    <circle cx="382" cy="314" r="7" fill="#00ff88" filter="url(#glow-led)"/>
    <circle cx="366" cy="314" r="5" fill="#00ff88" opacity="0.50"/>

    <!-- ── Rack Unit 5 ── -->
    <rect x="100" y="364" width="312" height="62" rx="7" fill="url(#unitGrad)"
          stroke="#bf00ff" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="114" y="377" width="158" height="5" rx="2.5" fill="#bf00ff" opacity="0.45"/>
    <rect x="114" y="388" width="122" height="4" rx="2"   fill="#bf00ff" opacity="0.28"/>
    <rect x="114" y="398" width="138" height="3" rx="1.5" fill="#bf00ff" opacity="0.18"/>
    <circle cx="382" cy="384" r="7" fill="#00ff88" filter="url(#glow-led)"/>
    <circle cx="366" cy="384" r="5" fill="#00ff88" opacity="0.50"/>

    <!-- ═══════════════════════════════════════════
         DINOSAUR CLAW MARKS
         Three parallel diagonal slashes (top-right → bottom-left)
         crossing the full rack face — signature ARK element
    ═══════════════════════════════════════════ -->

    <!-- Slash 1 — outermost left -->
    <!-- Glow halo -->
    <line x1="196" y1="72"  x2="120" y2="440"
          stroke="#bf00ff" stroke-width="22" stroke-linecap="round" stroke-opacity="0.35"
          filter="url(#glow-strong)"/>
    <!-- Core glow -->
    <line x1="196" y1="72"  x2="120" y2="440"
          stroke="#bf00ff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- Bright centre -->
    <line x1="196" y1="72"  x2="120" y2="440"
          stroke="#e080ff" stroke-width="4"  stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- Slash 2 — middle -->
    <line x1="263" y1="72"  x2="187" y2="440"
          stroke="#bf00ff" stroke-width="22" stroke-linecap="round" stroke-opacity="0.35"
          filter="url(#glow-strong)"/>
    <line x1="263" y1="72"  x2="187" y2="440"
          stroke="#bf00ff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="263" y1="72"  x2="187" y2="440"
          stroke="#e080ff" stroke-width="4"  stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- Slash 3 — rightmost -->
    <line x1="330" y1="72"  x2="254" y2="440"
          stroke="#bf00ff" stroke-width="22" stroke-linecap="round" stroke-opacity="0.35"
          filter="url(#glow-strong)"/>
    <line x1="330" y1="72"  x2="254" y2="440"
          stroke="#bf00ff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="330" y1="72"  x2="254" y2="440"
          stroke="#e080ff" stroke-width="4"  stroke-linecap="round" stroke-opacity="0.95"/>

  </g>
</svg>
